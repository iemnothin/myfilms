services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfilms
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - laravel
    depends_on:
      - db
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1

  webserver:
    image: nginx:latest
    container_name: myfilms-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: myfilms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myfilms
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  composer:
    image: composer:latest
    container_name: composer
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: ["composer", "--version"]
    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata:
